---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv
        args: ["run", "ruff", "check", "--fix", "."]
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv
        args: ["run", "ruff", "format", "."]
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy
        entry: uv
        args: ["run", "mypy", "src", "tasks"]
        language: system
        files: ^(src|tasks)/
        pass_filenames: false
        types: [python]
