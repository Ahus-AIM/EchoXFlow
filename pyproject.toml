[project]
name = "echoxflow"
version = "1.0.0"
description = "Library and example tasks for reading and loading the EchoXFlow echocardiographic dataset"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
  "av>=12.0.0",
  "matplotlib>=3.9.0",
  "numpy>=2.0.0",
  "pillow>=10",
  "PyYAML>=6.0.1",
  "zarr>=3.1",
]

[project.optional-dependencies]
tasks = [
  "monai>=1.3.0",
  "segmentation-models-pytorch>=0.5.0",
  "timm>=1.0.20",
  "torch>=2.0.0",
  "torchvision>=0.16.0",
  "tqdm>=4.67.3",
]
diffusion-eval = [
  "einops>=0.8",
  "h5py>=3.16",
  "huggingface_hub",
  "open_clip_torch>=3.3.0",
  "timm>=1.0.20",
  "torch-fidelity>=0.4.0",
  "torchvision>=0.16.0",
]
pandas = [
  "pandas>=2.0",
]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echoxflow = ["config/*.yml"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
tag_format = "v{version}"
commit_parser = "conventional"
build_command = "uv lock && git add uv.lock"
upload_to_vcs_release = true
allow_zero_version = true

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [
  ".uv-cache",
  "outputs",
  "tmp",
  ".tmp",
  "tasks/*/artifacts",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
exclude = [
  "^\\.venv/",
  "^\\.uv-cache/",
  "^\\.mypy_cache/",
  "^\\.pytest_cache/",
  "^outputs/",
  "^tmp/",
  "^\\.tmp/",
  "^tasks/.*/artifacts/",
]

[[tool.mypy.overrides]]
module = [
  "av.*",
  "matplotlib.*",
  "monai.*",
  "segmentation_models_pytorch.*",
  "timm.*",
  "torch.*",
  "torch_fidelity.*",
  "torchvision.*",
  "tqdm.*",
  "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[dependency-groups]
dev = [
  "mypy==1.14.1",
  "pre-commit==4.2.0",
  "pytest==8.3.5",
  "ruff==0.12.0",
  "torch>=2.0.0",
  "tqdm>=4.67.3",
  "types-PyYAML==6.0.12.20250402",
  "yamllint==1.37.1",
]
